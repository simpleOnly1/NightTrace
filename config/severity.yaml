# Exploratory path, not a calibrated model of real-night frequencies.
# Keep geometry identical along the path. S4 is an extreme stress probe.
profile:
  exposure: [1.0, 0.4, 0.12, 0.025, 0.005]
  shot_peak: [null, 400.0, 100.0, 25.0, 6.0]
  read_sigma: [0.0, 0.004, 0.012, 0.035, 0.08]
  glare_gain: [0.0, 0.5, 2.0, 8.0, 32.0]
geometry:
  source_count: [1, 2]
  u: [0.15, 0.85]
  v: [0.15, 0.75]
  radius: [0.35, 0.65] # whole-template half extent / short edge, not core size
  amplitude: [0.8, 1.2] # fixed per-source multiplier times glare_gain
  aspect: [0.8, 1.5]
  angle: [0.0, 3.141592653589793]
  streak_weight: [0.0, 0.5] # analytic backend only
