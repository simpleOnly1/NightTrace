project: NightTrace
seed: 42
device: cuda
data:
  name: robotcar
  gt_space: raw  # Use cropped only for verified GT already in the RGB crop coordinates.
  gt_suffix: _depth
  root: data/RobotCar-Night
  day_package: 2014-12-09-13-21-02
  night_package: 2014-12-16-18-44-24
  input_height: 392
  input_width: 672
  crop_width: 1152
  crop_height: 640
  num_workers: 4
  offsets: [-1, 1]
model:
  name: dav2_vitl
  weights: models/checkpoints/depth_anything_v2_vitl.pth
  input_size: 518
  encoder_frozen: true
  train_dpt: true
  inverse_epsilon: 0.001
train:
  stage: day
  batch_size: 2
  epochs: 10
  lr: 0.00005
  weight_decay: 0.0001
  smoothness_weight: 0.001
  grad_clip: 1.0
  log_every: 50
  save_dir: runs/robotcar_day
  resume: ''
eval:
  split: night
  align: median
  input_is: relative_depth  # predictions.npy stores depth, not DAV2 q
  min_depth: 0.1
  max_depth: 40.0
  # STEPS-style input image central crop; GT spatial matching is verified at runtime.
  vis_percentile: 95
  output: results/robotcar

# Lightweight frozen-model diagnosis. These are starting ranges, not calibration.
diagnosis:
  flare_dir: /080226/Nighttime_Depth_Estimation/datasets/Flare7Kpp/Flare7K  # Official Flare7K++ scattering/reflective templates
  block_seconds: 30  # RobotCar time blocks; nuScenes uses clip directories
  min_gap_seconds: 1.0  # for recognized microsecond timestamps
  min_gap_frames: 10    # fallback when timestamp is unavailable
  duplicate_mae: 0.015  # 18x32 gray thumbnail MAE, [0,1]; 0 disables
  degradation_ranges:
    exposure: [0.08, 0.4]
    shot_peak: [100.0, 500.0]
    read_sigma: [0.001, 0.008]
    source_count: [1, 3]
    u: [-0.1, 1.1]  # image-plane coordinates; allows near-frame exterior sources
    v: [0.1, 0.7]   # broad road-image prior, not semantic placement
    radius: [0.025, 0.15]  # fraction of short edge, NOT source depth
    amplitude: [0.2, 1.2]
    aspect: [0.6, 1.8]
    angle: [0.0, 3.141592653589793]
    streak_weight: [0.0, 0.5]
